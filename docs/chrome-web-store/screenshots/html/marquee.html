<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1400px; height: 560px; background: linear-gradient(120deg, #312e81 0%, #4f46e5 40%, #818cf8 100%); font-family: system-ui, sans-serif; display: flex; align-items: center; padding: 0 80px; color: white; overflow: hidden; }
    .content { flex: 1; }
    .logo { font-size: 14px; font-weight: 700; letter-spacing: .08em; opacity: .8; margin-bottom: 16px; }
    h1 { font-size: 52px; font-weight: 800; line-height: 1.1; margin-bottom: 16px; max-width: 600px; }
    p { font-size: 20px; opacity: .92; max-width: 520px; line-height: 1.5; }
    .mock { width: 480px; height: 360px; background: rgba(255,255,255,.12); border-radius: 20px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2); padding: 20px; }
    .mock-inner { background: #f8f8f8; border-radius: 12px; height: 100%; color: #1a1a1a; padding: 16px; font-size: 13px; }
    .mock-title { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .s { width: 20px; height: 20px; background: #4f46e5; border-radius: 5px; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  </style>
</head>
<body>
  <div class="content">
    <div class="logo">SWEARCH</div>
    <h1>Turn research reading into structured insights</h1>
    <p>Highlight · Summarize · Export to your Google Doc</p>
  </div>
  <div class="mock">
    <div class="mock-inner">
      <div class="mock-title"><span class="s">S</span> Summarize</div>
      <p style="color:#666;font-style:italic;font-size:12px;margin-bottom:12px">Selected passage from arXiv paper…</p>
      <p style="font-size:12px;line-height:1.5">AI-generated summary with relevance to your active project and one-click export.</p>
    </div>
  </div>
</body>
</html>
