<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 440px; height: 280px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); font-family: system-ui, sans-serif; display: flex; align-items: center; padding: 24px; color: white; overflow: hidden; }
    .logo { width: 48px; height: 48px; background: white; border-radius: 12px; color: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; margin-right: 16px; flex-shrink: 0; }
    h1 { font-size: 22px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
    p { font-size: 13px; opacity: .9; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="logo">S</div>
  <div>
    <h1>Swearch</h1>
    <p>Highlight papers. Get AI insights. Export to Google Docs.</p>
  </div>
</body>
</html>
